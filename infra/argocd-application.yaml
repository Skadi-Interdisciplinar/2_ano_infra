apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skadi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Skadi-Interdisciplinar/2_ano_infra.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: skadi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
