name: Deploy Skadi

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Instalar kubectl
        run: |
          curl -fsSL -o kubectl "https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Localizar o ultimo build de cada repositorio
        id: runs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          backend=$(gh run list --repo Skadi-Interdisciplinar/2_ano_backend --workflow build.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          frontend=$(gh run list --repo Skadi-Interdisciplinar/2_ano_frontend --workflow build.yaml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          ia=$(gh run list --repo Skadi-Interdisciplinar/2_ano_back_ia --workflow build.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$backend" ] || [ "$backend" = "null" ]; then
            echo "Nenhum build bem-sucedido do backend na main." >&2
            exit 1
          fi
          if [ -z "$frontend" ] || [ "$frontend" = "null" ]; then
            echo "Nenhum build bem-sucedido do frontend na main." >&2
            exit 1
          fi
          if [ -z "$ia" ] || [ "$ia" = "null" ]; then
            echo "Nenhum build bem-sucedido do 2_ano_back_ia na main." >&2
            exit 1
          fi
          echo "backend_run_id=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend_run_id=$frontend" >> "$GITHUB_OUTPUT"
          echo "ia_run_id=$ia" >> "$GITHUB_OUTPUT"

      - name: Baixar o JAR do backend
        uses: actions/download-artifact@v4
        with:
          name: skadi-api
          repository: Skadi-Interdisciplinar/2_ano_backend
          run-id: ${{ steps.runs.outputs.backend_run_id }}
          github-token: ${{ secrets.GH_PAT }}
          path: artifacts/backend

      - name: Baixar a build do frontend
        uses: actions/download-artifact@v4
        with:
          name: skadi_frontend
          repository: Skadi-Interdisciplinar/2_ano_frontend
          run-id: ${{ steps.runs.outputs.frontend_run_id }}
          github-token: ${{ secrets.GH_PAT }}
          path: artifacts/frontend

      - name: Baixar o pacote da IA
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          repository: Skadi-Interdisciplinar/2_ano_back_ia
          run-id: ${{ steps.runs.outputs.ia_run_id }}
          github-token: ${{ secrets.GH_PAT }}
          path: artifacts/ia

      - name: Publicar imagens e gravar a tag no Git
        env:
          ARTIFACTS_PREFETCHED: "true"
          AWS_DEFAULT_REGION: us-east-1
          CLUSTER_NAME_OVERRIDE: skadi
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SECURITY_KEY: ${{ secrets.SECURITY_KEY }}
          EXPIRATION_TIME: ${{ secrets.EXPIRATION_TIME }}
        run: bash scripts/deploy.sh

      - name: Enviar o kustomization para o Argo CD sincronizar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca na tag das imagens."
            exit 0
          fi
          git commit -m "Publica as imagens do Skadi no Argo CD."
          git push
