# Exemplo. Nao aplique este arquivo.
# O deploy cria o Secret skadi-backend com os dados do Postgres da Aiven.
# Nao aplique este arquivo.
apiVersion: v1
kind: Secret
metadata:
  name: skadi-backend
  namespace: skadi
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://MOCK_AIVEN_HOST:MOCK_PORT/MOCK_DB?sslmode=require"
  DB_USERNAME: "avnadmin"
  DB_PASSWORD: "MOCK_AIVEN_PASSWORD"
  SECURITY_KEY: "MOCK_SECURITY_KEY"
  EXPIRATION_TIME: "3600"
